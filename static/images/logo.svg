<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d4edd;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow Circle -->
  <circle cx="50" cy="50" r="34" fill="url(#grad1)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="50" cy="50" r="30" fill="#0b0e1a"/>
  <!-- Play Triangle -->
  <polygon points="42,35 66,50 42,65" fill="url(#grad1)" />
  <!-- Text -->
  <text x="100" y="58" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    MX <tspan fill="#00d2ff">STATION</tspan>
  </text>
  <text x="102" y="78" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8b9bb4" letter-spacing="4">
    PLAYER PORTAL
  </text>
</svg>
