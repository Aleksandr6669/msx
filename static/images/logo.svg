<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Modern Rounded Icon Container -->
  <rect x="16" y="16" width="68" height="68" rx="20" fill="#0f172a" stroke="url(#portalGrad)" stroke-width="2.5" filter="url(#softGlow)"/>
  <!-- Smart Home Cottage Roof & Body Icon -->
  <path d="M50 30 L66 43 L66 65 C66 67.2 64.2 69 62 69 L38 69 C35.8 69 34 67.2 34 65 L34 43 Z" fill="none" stroke="url(#portalGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door / Portal Arch -->
  <path d="M45 69 L45 54 C45 51.8 46.8 50 49 50 L51 50 C53.2 50 55 51.8 55 54 L55 69" fill="url(#portalGrad)" opacity="0.85"/>
  <!-- Glowing Dot (Smart TV Signal) -->
  <circle cx="50" cy="40" r="3" fill="#ffffff" filter="url(#softGlow)"/>
  
  <!-- Typography -->
  <text x="104" y="55" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1.5">
    HOME <tspan fill="#00d2ff">PORTAL</tspan>
  </text>
  <text x="106" y="76" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="4">
    SMART TV HUB
  </text>
</svg>