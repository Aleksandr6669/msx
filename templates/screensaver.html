<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Portal — 4K Ambient Screensaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600;800&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030509;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
        }

        /* Fullscreen Animated Canvas for Cosmic Particles */
        #starsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Ambient Glowing Nebula Blobs */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .nebula-1 {
            width: 65vw;
            height: 65vw;
            top: -15%;
            left: -10%;
            background: radial-gradient(circle, #7928ca 0%, #4c1d95 40%, transparent 70%);
        }

        .nebula-2 {
            width: 55vw;
            height: 55vw;
            bottom: -15%;
            right: -10%;
            background: radial-gradient(circle, #0070f3 0%, #00d2ff 40%, transparent 70%);
            animation-duration: 25s;
            animation-direction: alternate-reverse;
        }

        .nebula-3 {
            width: 40vw;
            height: 40vw;
            top: 30%;
            left: 35%;
            background: radial-gradient(circle, #ec4899 0%, transparent 60%);
            opacity: 0.25;
            animation-duration: 18s;
        }

        @keyframes drift {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.1) translate(40px, -30px); }
            100% { transform: scale(0.95) translate(-30px, 40px); }
        }

        /* Screensaver UI Overlay */
        .screensaver-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 80px;
            background: radial-gradient(circle at center, transparent 40%, rgba(3, 5, 9, 0.6) 100%);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 10px 22px;
            border-radius: 99px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .brand-badge .icon {
            color: #00d2ff;
            font-size: 26px;
            animation: spin 30s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .brand-badge .title {
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.95rem;
            color: #f0f4fc;
        }

        .weather-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 99px;
            font-size: 0.95rem;
            color: #a0aec0;
        }

        .weather-pill .material-icons {
            color: #fbbf24;
            font-size: 22px;
        }

        /* Center Showcase (Giant Ambient Clock) */
        .center-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .clock-time {
            font-size: clamp(6rem, 16vw, 13rem);
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 40%, rgba(255, 255, 255, 0.3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 20px 80px rgba(0, 210, 255, 0.3);
            margin-bottom: 15px;
        }

        .clock-date {
            font-size: clamp(1.2rem, 2.5vw, 2.2rem);
            font-weight: 400;
            color: #94a3b8;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .ambient-status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 8px 24px;
            border-radius: 99px;
            color: #00d2ff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .pulsing-wave {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00d2ff;
            box-shadow: 0 0 15px #00d2ff;
            animation: pulse-ring 2s infinite ease-out;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(0.9); opacity: 1; }
        }

        /* Bottom Info & Relax Mode Switch */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .music-track {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            border-radius: 16px;
        }

        .music-disc {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7928ca, #0070f3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(121, 40, 202, 0.5);
            animation: spin 8s linear infinite;
        }

        .music-details h4 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .music-details p {
            font-size: 0.8rem;
            color: #64748b;
        }

        .remote-hint {
            color: #64748b;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remote-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            color: #cbd5e1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <!-- Background Nebulas -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <!-- Particle Canvas -->
    <canvas id="starsCanvas"></canvas>

    <!-- Overlay Contents -->
    <div class="screensaver-overlay">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand-badge">
                <span class="material-icons icon">blur_on</span>
                <span class="title">HOME PORTAL • AMBIENT 4K</span>
            </div>
            <div class="weather-pill">
                <span class="material-icons">wb_twilight</span>
                <span>Режим отдыха • 4K HDR</span>
            </div>
        </div>

        <!-- Center Stage -->
        <div class="center-stage">
            <div class="clock-time" id="ssClock">19:42</div>
            <div class="clock-date" id="ssDate">Понедельник, 12 Октября</div>
            <div class="ambient-status">
                <span class="pulsing-wave"></span>
                <span>Атмосферный режим активен</span>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="music-track">
                <div class="music-disc">
                    <span class="material-icons" style="font-size: 20px; color: #fff;">music_note</span>
                </div>
                <div class="music-details">
                    <h4>Lo-Fi Chill & Cosmic Waves</h4>
                    <p>Ambient Soundtrack 24/7</p>
                </div>
            </div>
            <div class="remote-hint">
                <span>Нажмите</span>
                <kbd>BACK</kbd>
                <span>или</span>
                <kbd>ESC</kbd>
                <span>для возврата в меню</span>
            </div>
        </div>
    </div>

    <script>
        // Clock & Date Updater
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('ssClock').textContent = `${hours}:${minutes}`;

            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            const dateStr = now.toLocaleDateString('ru-RU', options);
            document.getElementById('ssDate').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Stars & Floating Dust Canvas
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const count = 90;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2 + 0.5,
                alpha: Math.random() * 0.7 + 0.2,
                dx: (Math.random() - 0.5) * 0.4,
                dy: (Math.random() - 0.5) * 0.4
            });
        }

        function renderParticles() {
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200, 225, 255, ${p.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00d2ff';
                ctx.fill();

                p.x += p.dx;
                p.y += p.dy;

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;
            });

            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // Escape key to go back
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'Backspace') {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
